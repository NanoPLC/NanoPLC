# Build and verify the NanoPLC VS Code extension (no release).
name: VS Code extension CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
    paths:
      - "nanoplc-vscode/**"
      - "packages/ir-schema/**"
      - "firmware/**"
      - ".github/workflows/vscode-extension-*.yml"
  pull_request:
    paths:
      - "nanoplc-vscode/**"
      - "packages/ir-schema/**"
      - "firmware/**"
      - ".github/workflows/vscode-extension-*.yml"

concurrency:
  group: vscode-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanoplc-vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/ir-schema/package-lock.json
            nanoplc-vscode/package-lock.json

      - name: Install @nanoplc/ir-schema dependencies
        working-directory: packages/ir-schema
        run: npm ci

      - name: Install extension dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: nanoplc-vscode-vsix
          path: nanoplc-vscode/*.vsix
          if-no-files-found: error
